# 写真からカロリーを予想する小さなサーバー（Cloudflare Workers）
# APIキーはここに書かず、`npx wrangler secret put ANTHROPIC_API_KEY` で入れる
name = "calojack-ai"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# この場所から開いたページだけ使える（カンマ区切り）
ALLOWED_ORIGINS = "https://naarata049-maker.github.io,http://127.0.0.1:5173,http://localhost:5173"
# 使うモデル。くわしく見てほしいときは claude-opus-5-5 に変える
MODEL = "claude-haiku-5-5"
